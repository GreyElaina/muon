[package]
name = "muon-store-benches"
version = "0.1.0"
edition = "2021"

[dependencies]
muon = { path = "../muon", features = ["default"], version = "0.20.1" }
muon-store = { path = "../muon-store" }
serde = { version = "1.0", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
sycamore-reactive = "0.9.2"
muon-sync = { version = "0.1.0", path = "../muon-sync" }
reactive_graph = { version = "0.2.14", features = ["effects"] }
muon-reactivity = { version = "0.1.0", path = "../muon-reactivity" }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["rt", "time"] }

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false
