[package]
name = "muon-sync"
version = "0.1.0"
edition = "2021"
description = "CRDT sequence containers and the LSE-style sync pipeline over muon observation"

[dependencies]
muon = { path = "../muon", features = ["json"], version = "0.20.1" }
muon-store = { path = "../muon-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional transport implementations
ureq = { version = "3", optional = true }
thiserror = "2.0.19"
or_poisoned = "0.1.0"
rand = "0.10.2"
redb = "=4.1.0"
futures = { version = "0.3.33", default-features = false, features = ["std"] }
json-patch = "4.2.0"
erased-serde = "0.4.10"

[features]
default = []
http-transport = ["dep:ureq"]

[dev-dependencies]
indexmap = { version = "2", features = ["serde"] }
loro = "1.13.9"
muon = { path = "../muon", features = ["indexmap"], version = "0.20.1" }
muon-reactivity = { path = "../muon-reactivity" }
muon-store = { path = "../muon-store", features = ["indexmap"] }
proptest = "1.11.0"
reactive_graph = { version = "0.2.14", features = ["effects"] }
tokio = { version = "1.53.1", features = ["rt", "sync"] }
