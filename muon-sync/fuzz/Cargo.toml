[package]
name = "muon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.muon-sync]
path = ".."

[dependencies.loro]
version = "1.13.9"

[[bin]]
name = "engine_oracle"
path = "fuzz_targets/engine_oracle.rs"
test = false
doc = false
bench = false
